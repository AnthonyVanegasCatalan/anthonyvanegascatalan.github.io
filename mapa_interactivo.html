    console.log("Total de registros cargados:", data.length);

    // Inicialización del mapa
    var map = L.map('map').setView([0, 0], 2);

    // Capa base de OpenStreetMap (se usan doble llaves para imprimir literalmente)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Marcador de prueba
    L.marker([0,0]).addTo(map).bindPopup("Test marker");

    var posLayer = L.layerGroup().addTo(map);
    var clusterLayer = L.layerGroup().addTo(map);

    function getColor(grade) {
      switch(grade) {
        case 'A1': return 'green';
        case 'A': return '#90ee90';
        case 'B': return 'yellow';
        case 'C': return 'orange';
        case 'D': return 'red';
        default: return 'gray';
      }
    }

    function populateFilters(filteredData) {
      function uniqueValues(field) {
        var values = filteredData.map(function(d) { return d[field]; });
        return Array.from(new Set(values)).filter(function(v) { return v !== null && v !== undefined; }).sort();
      }
      var countrySelect = $('#filter-country');
      var deptSelect = $('#filter-departamento');
      var munSelect = $('#filter-municipio');
      var clusterCodeSelect = $('#filter-clustercode');
      var countryRankSelect = $('#filter-countrank');
      var currentCountry = countrySelect.val();
      var currentDept = deptSelect.val();
      var currentMun = munSelect.val();
      var currentClusterCode = clusterCodeSelect.val();
      var currentCountryRank = countryRankSelect.val();
      function fillDropdown(selectElement, values, placeholder) {
        selectElement.empty();
        selectElement.append($('<option>', { value: 'All', text: placeholder + ': Todos' }));
        values.forEach(function(val) {
          selectElement.append($('<option>', { value: val, text: val }));
        });
      }
      fillDropdown(countrySelect, uniqueValues('Country'), 'País');
      fillDropdown(deptSelect, uniqueValues('Departamento'), 'Departamento');
      fillDropdown(munSelect, uniqueValues('Municipio'), 'Municipio');
      fillDropdown(clusterCodeSelect, uniqueValues('Cluster Code'), 'Cluster Code');
      fillDropdown(countryRankSelect, uniqueValues('Rank Country'), 'Country Rank');
      if(countrySelect.find("option[value='" + currentCountry + "']").length) {
        countrySelect.val(currentCountry);
      }
      if(deptSelect.find("option[value='" + currentDept + "']").length) {
        deptSelect.val(currentDept);
      }
      if(munSelect.find("option[value='" + currentMun + "']").length) {
        munSelect.val(currentMun);
      }
      if(clusterCodeSelect.find("option[value='" + currentClusterCode + "']").length) {
        clusterCodeSelect.val(currentClusterCode);
      }
      if(countryRankSelect.find("option[value='" + currentCountryRank + "']").length) {
        countryRankSelect.val(currentCountryRank);
      }
    }

    function updateMap() {
      posLayer.clearLayers();
      clusterLayer.clearLayers();
      var selectedCountry = $('#filter-country').val();
      var selectedDept = $('#filter-departamento').val();
      var selectedMun = $('#filter-municipio').val();
      var selectedClusterCode = $('#filter-clustercode').val();
      var selectedCountryRank = $('#filter-countrank').val();
      var filteredData = data.filter(function(d) {
        return (selectedCountry === 'All' || d['Country'] === selectedCountry) &&
               (selectedDept === 'All' || d['Departamento'] === selectedDept) &&
               (selectedMun === 'All' || d['Municipio'] === selectedMun) &&
               (selectedClusterCode === 'All' || d['Cluster Code'] === selectedClusterCode) &&
               (selectedCountryRank === 'All' || String(d['Rank Country']) === selectedCountryRank);
      });
      console.log("Registros tras aplicar filtros:", filteredData.length);
      populateFilters(filteredData);
      var allLatLngs = [];
      // Si el filtro Country Rank no es "All", se aumenta ligeramente el radio de POS
      var posRadius = (selectedCountryRank === 'All') ? 2 : 4;
      if($('#checkbox-pos').is(':checked')) {
        filteredData.forEach(function(d) {
          if(d['Latitud'] && d['Longitud']) {
            var lat = parseFloat(d['Latitud']);
            var lng = parseFloat(d['Longitud']);
            var marker = L.circleMarker([lat, lng], {
              radius: posRadius,
              fillColor: getColor(d['Grade']),
              color: getColor(d['Grade']),
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8
            });
            var popup_info = "<div style='font-size:14px; line-height:1.8; min-width:300px; min-height:200px; padding:10px; border:1px solid #ccc; border-radius:5px; background-color:white;'>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>POS Name:</b> " + d['POS Name'] + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Country Rank:</b> " + d['Rank Country'] + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Volumen:</b> $" + Number(d['Volumen']).toLocaleString() + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Coverage:</b> " + d['Coverage'] + "</div>" +
                             "<div style='padding:5px;'><b>FF:</b> " + d['Promotores'] + "</div>" +
                             "</div>";
            marker.bindPopup(popup_info);
            marker.bindTooltip(popup_info);
            marker.addTo(posLayer);
            // Si se ha seleccionado un valor distinto de "All" en Country Rank, se abre automáticamente el popup
            if(selectedCountryRank !== "All") {
              marker.openPopup();
            }
            allLatLngs.push([lat, lng]);
          }
        });
      }
      if($('#checkbox-cluster').is(':checked')) {
        var clusters = {};
        filteredData.forEach(function(d) {
          var clusterCode = d['Cluster Code'];
          if(clusterCode && clusterCode !== 'Stand Alone') {
            if(!clusters[clusterCode]) {
              clusters[clusterCode] = [];
            }
            clusters[clusterCode].push(d);
          }
        });
        Object.keys(clusters).forEach(function(clusterCode) {
          var points = clusters[clusterCode];
          if(points.length > 0) {
            var sumLat = 0, sumLng = 0;
            points.forEach(function(d) {
              sumLat += parseFloat(d['Latitud']);
              sumLng += parseFloat(d['Longitud']);
            });
            var centerLat = sumLat / points.length;
            var centerLng = sumLng / points.length;
            var center = L.latLng(centerLat, centerLng);
            var maxDistance = 0;
            points.forEach(function(d) {
              var point = L.latLng(parseFloat(d['Latitud']), parseFloat(d['Longitud']));
              var distance = center.distanceTo(point);
              if(distance > maxDistance) {
                maxDistance = distance;
              }
            });
            var radius = maxDistance + 100;
            var total_points = points.length;
            var total_ff = 0;
            var total_volumen = 0;
            points.forEach(function(d) {
              total_ff += parseFloat(d['Promotores']) || 0;
              total_volumen += parseFloat(d['Volumen']) || 0;
            });
            var rank = points[0]['Rank Country'];
            var clusterName = points[0]['Cluster Name'];
            var popup_info = "<div style='font-size:14px; line-height:1.8; min-width:300px; min-height:200px; padding:10px; border:1px solid #ccc; border-radius:5px; background-color:white;'>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Cluster Code:</b> " + clusterCode + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Cluster Name:</b> " + clusterName + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Country Rank:</b> " + rank + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>Volumen:</b> $" + Number(total_volumen).toLocaleString() + "</div>" +
                             "<div style='border-bottom:1px solid #ccc; padding:5px;'><b>POS QTY:</b> " + total_points + "</div>" +
                             "<div style='padding:5px;'><b>FF:</b> " + total_ff + "</div>" +
                             "</div>";
            var tooltip_info = popup_info;
            var circle = L.circle(center, {
              radius: radius,
              color: 'gray',
              weight: 2,
              fillOpacity: 0.1
            });
            circle.bindPopup(popup_info);
            circle.bindTooltip(tooltip_info);
            circle.addTo(clusterLayer);
            var circleBounds = circle.getBounds();
            allLatLngs.push(circleBounds.getNorthEast());
            allLatLngs.push(circleBounds.getSouthWest());
          }
        });
      }
      if(allLatLngs.length > 0) {
        var bounds = L.latLngBounds(allLatLngs);
        map.fitBounds(bounds);
      }
    }

    $(document).ready(function() {
      populateFilters(data);
      updateMap();
      $('#filters select, #toggles input').on('change', function() {
        updateMap();
      });
      $('#reset-filters').on('click', function() {
        $('#filter-country').val("All");
        $('#filter-departamento').val("All");
        $('#filter-municipio').val("All");
        $('#filter-clustercode').val("All");
        $('#filter-countrank').val("All");
        updateMap();
      });
    });
  </script>
